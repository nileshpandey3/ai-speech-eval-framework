name: Scheduled speech benchmark

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark accuracy gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev, deepgram]"

      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-whisper-${{ hashFiles('src/speech_eval/config.py') }}

      - name: Prepare output directory
        run: mkdir -p outputs

      - name: Run benchmark gate
        run: |
          python -m pytest -m benchmark -q \
            --html=outputs/benchmark-report.html \
            --self-contained-html

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence
          path: |
            outputs/benchmark-results.json
            outputs/benchmark-report.html
          retention-days: 14
