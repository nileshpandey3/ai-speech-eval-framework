name: Speech evaluation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-tests:
    name: PR decision gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run deterministic tests
        run: python -m pytest -m "not live" -s

  live-smoke:
    name: Live accuracy gate
    needs: fast-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-whisper-${{ hashFiles('src/speech_eval/config.py') }}

      - name: Prepare output directory
        run: mkdir -p outputs

      - name: Run live accuracy gate
        run: |
          python -m pytest -m live -q \
            --html=outputs/live-report.html \
            --self-contained-html \

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-evidence
          path: |
            outputs/results.json
            outputs/live-report.html
          retention-days: 14
