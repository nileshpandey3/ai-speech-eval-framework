name: Speech evaluation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-tests:
    name: Fast Framework Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev, deepgram]"

      - name: Run deterministic tests
        run: python -m pytest -m "not live" -s

  live-smoke:
    name: Live accuracy gate
    needs: fast-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev, deepgram]"

      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-whisper-${{ hashFiles('src/speech_eval/config.py') }}

      - name: Prepare output directory
        run: mkdir -p outputs

      - name: Run live accuracy gate
        run: |
          python -m pytest -m "live and not benchmark and not deepgram_live and not customer" -q \
            --html=outputs/live-report.html \
            --self-contained-html

      # This runs the customer checks even if the preceding accuracy gate fails,
      # provided the workflow hasn’t been canceled
      - name: Run customer acceptance gate
        if: ${{ !cancelled() }}
        run: |
          python -m pytest -m "customer and not deepgram_live" -q \
            --html=outputs/customer-report.html

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-evidence
          path: |
            outputs/results.json
            outputs/live-report.html
            outputs/customer-results.json
            outputs/customer-report.html
            outputs/assets/
          retention-days: 14
