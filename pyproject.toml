[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-speech-eval-framework"
version = "0.1.0"
description = "A small speech-to-text evaluation pipeline"
requires-python = ">=3.11"
dependencies = [
    "jiwer>=4,<5",
    "faster-whisper>=1,<2",
    "av==18.0.0", # Avoid the PyAV 19 metadata_errors API change
    "pytest-html>=4,<5",

]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: runs the actual speech model",
]
